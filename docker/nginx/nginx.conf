# Nginx reverse proxy for webhook mode — TLS termination happens here or upstream.
limit_req_zone $binary_remote_addr zone=botzone:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # Telegram webhook endpoint
    location /tg-webhook-secret {
        limit_req zone=botzone burst=40 nodelay;
        proxy_pass http://bot:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # basic DDoS hardening for everything else
    location / {
        limit_req zone=botzone burst=20 nodelay;
        return 404;
    }
}
