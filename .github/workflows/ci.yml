name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Python ${{ matrix.python }} — compile + pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      DATABASE_URL: "sqlite+aiosqlite:///./data/bot.db"
      BOT_TOKEN: "1:test"          # never used for network in tests
      ENCRYPTION_KEY: "dGVzdC1rZXktMzItYnl0ZXMtbG9uZy1lbm91Z2gh"  # base64 test key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile the whole tree
        run: python -m compileall -q bot reports database config scripts tests

      - name: Import smoke test
        run: |
          python - <<'PY'
          from bot.handlers import commands
          from bot.main import create_app
          from reports.generators.json_generator import JSONReport, REPORT_VERSION
          assert len(commands.COMMANDS) == 18, f"expected 18 commands, got {len(commands.COMMANDS)}"
          print("smoke OK —", len(commands.COMMANDS), "commands, JSON report", REPORT_VERSION)
          PY

      - name: Run test suite
        run: pytest tests/ -v --tb=short

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build bot image
        run: docker build -f docker/Dockerfile -t tiktok-intel-bot:ci .
      - name: Validate compose file
        run: |
          cp docker/.env.example docker/.env
          docker compose -f docker/docker-compose.yml --env-file docker/.env config -q
